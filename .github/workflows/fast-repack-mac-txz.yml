# Repack the fixed approved ZIP without changing the app or model.
# The helper below is embedded verbatim from fast-repack-mac-txz.py.
name: Repack approved Mac preview as compact tar.xz (3 threads)
run-name: Lossless compact tar.xz for mac-preview-0.13.4

'on':
  workflow_dispatch:

permissions: {}

concurrency:
  group: dba-voice-compact-repack-mac-preview-0.13.4
  cancel-in-progress: false

jobs:
  repack:
    if: github.repository == 'munchtokyo/dba-voice-releases' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Build and verify a tar.xz from the fixed public ZIP
        env:
          REPACK_DIR: ${{ runner.temp }}/dba-voice-lossless-compact-txz
        run: |
          set -euo pipefail
          command -v python3
          command -v xz
          command -v tar
          command -v ditto
          command -v codesign
          command -v curl
          command -v gh
          python3 -c 'import sys; assert sys.version_info >= (3, 9), "Python 3.9 or later is required; no install attempted"'
          cat > "$RUNNER_TEMP/dba-voice-fast-repack-mac-txz.py" <<'PY_REPACK'
          #!/usr/bin/env python3
          """Runner helper. Build/check only; publication is a separate gh command.
          
          Intended for the public repo's manually dispatched macos-14 workflow. This file
          is embedded verbatim in fast-repack-mac-txz.yml; it is not downloaded at run time.
          """
          
          import argparse
          import collections
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import plistlib
          import shutil
          import stat
          import subprocess
          import tarfile
          import urllib.request
          import zipfile
          
          
          REPO = "munchtokyo/dba-voice-releases"
          TAG = "mac-preview-0.13.4"
          RELEASE_ID = 390720470
          ZIP_NAME = "DBA-Voice-Mac.zip"
          ZIP_BYTES = 1498786911
          ZIP_SHA256 = "74114f85770c79a9fb8f9d7d155a51b34d6a225ba6357affcc989aa5e24a2e17"
          DMG_NAME = "DBA-Voice-Mac.dmg"
          DMG_BYTES = 1425636185
          # Integer floor ensures at least 1% less than the existing public DMG.
          MAXIMUM_ARCHIVE_BYTES = DMG_BYTES * 99 // 100
          APP_NAME = "DBA Voice.app"
          APP_CDHASH = "3384b35cbf6fc88583f85427eb646774945d4497"
          MODEL_PATH = "Contents/Resources/Models/ggml-large-v3-turbo.bin"
          MODEL_SHA256 = "1fc70f774d38eb169993ac391eea357ef47c88757ef72ee5943879b7e8e2bc69"
          MODEL_BYTES = 1624555275
          ASSET_NAMES = ("DBA-Voice-Mac-compact.tar.xz", "DBA-Voice-Mac-compact.tar.xz.sha256", "DBA-Voice-Mac-compact.tar.xz.verification.json")
          CONCURRENT_ARCHIVE_NAME = "DBA-Voice-Mac.tar.xz"
          CONCURRENT_ARCHIVE_BYTES = 1344471720
          CONCURRENT_ARCHIVE_SHA256 = "164e4e0518ec9bcd9369a658db645fb7e459ed768983bcb679001782d70f61c5"
          XZ_OPTIONS = ["-T3", "--block-size=192MiB", "--memlimit-compress=4GiB", "--no-adjust", "--lzma2=preset=9e,lc=0,lp=1,pb=1", "-c"]
          TAR_OPTIONS = ["--format=pax", "--uid", "0", "--gid", "0", "--uname", "root",
                         "--gname", "wheel", "--no-xattrs", "--no-acls", "--no-fflags", "--no-mac-metadata"]
          
          
          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          
          
          def run(*args, **kwargs):
              return subprocess.run([str(arg) for arg in args], check=True, **kwargs)
          
          
          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(4 * 1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()
          
          
          def canonical_bytes(value):
              return json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=True).encode()
          
          
          def write_json(path, value):
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          
          
          def snapshot(root):
              """No symlink traversal. Include root, full modes, mtime and every file hash."""
              entries = {}
          
              def visit(path, relative):
                  info = path.lstat()
                  entry = {"mode": format(stat.S_IMODE(info.st_mode), "04o"), "mtime_ns": info.st_mtime_ns}
                  if stat.S_ISLNK(info.st_mode):
                      entry.update(kind="symlink", target=os.readlink(path))
                      # Existing bundle links must remain inside the app, including chained links.
                      require(path.resolve().is_relative_to(root.resolve()), f"Bundle link escapes the app: {relative}")
                  elif stat.S_ISREG(info.st_mode):
                      entry.update(kind="file", bytes=info.st_size, sha256=sha256(path))
                  elif stat.S_ISDIR(info.st_mode):
                      entry["kind"] = "directory"
                  else:
                      raise RuntimeError(f"Unsupported bundle entry: {relative}")
                  entries[relative] = entry
                  if entry["kind"] == "directory":
                      for child in sorted(path.iterdir(), key=lambda p: p.name):
                          visit(child, child.relative_to(root).as_posix())
          
              visit(root, ".")
              return entries
          
          
          def require_same(expected, actual, label):
              changed = [key for key in sorted(set(expected) | set(actual)) if expected.get(key) != actual.get(key)]
              require(not changed, f"{label}: {len(changed)} differing entries: {changed[:8]}")
          
          
          def public_release():
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}/releases/tags/{TAG}",
                  headers={"Accept": "application/vnd.github+json", "User-Agent": "DBA-Voice-lossless-repack"},
              )
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.load(response)
          
          
          def validate_release(release, require_absent=True):
              require(release.get("id") == RELEASE_ID and release.get("tag_name") == TAG
                      and release.get("draft") is False, "Unexpected release identity or state")
              assets = {asset["name"]: asset for asset in release["assets"]}
              require(len(assets) == len(release["assets"]), "Duplicate asset names")
              if require_absent:
                  require(not set(ASSET_NAMES).intersection(assets), "Target asset already exists; refusing replacement")
              source = assets.get(ZIP_NAME, {})
              require(source.get("size") == ZIP_BYTES and source.get("digest") == "sha256:" + ZIP_SHA256,
                      "Release ZIP metadata does not match the fixed approved ZIP")
              require(assets.get(DMG_NAME, {}).get("size") == DMG_BYTES,
                      "Existing public DMG size no longer matches the fixed comparison baseline")
              return assets
          
          
          def validate_archive_size(byte_count):
              require(0 < byte_count <= MAXIMUM_ARCHIVE_BYTES,
                      f"Archive must be at least 1% smaller than the existing {DMG_BYTES}-byte DMG; maximum={MAXIMUM_ARCHIVE_BYTES}, actual={byte_count}")
          
          
          def require_unchanged_release(before, after):
              # Download counters and timestamps can change independently; they are not content identity.
              for key in ("id", "tag_name", "name", "body", "draft", "prerelease", "target_commitish"):
                  require(before.get(key) == after.get(key), f"Existing release metadata changed: {key}")
              old = {asset["name"]: asset for asset in before["assets"]}
              new = {asset["name"]: asset for asset in after["assets"]}
              for name, asset in old.items():
                  require(name in new, f"Existing asset disappeared: {name}")
                  for key in ("id", "name", "size", "digest", "browser_download_url", "state"):
                      require(asset.get(key) == new[name].get(key), f"Existing asset changed: {name} / {key}")
          
          
          def codesign_identity(app):
              run("codesign", "--verify", "--deep", "--strict", app)
              result = run("codesign", "-dvvv", app, capture_output=True, text=True)
              values = {}
              for line in result.stderr.splitlines():
                  if line.startswith(("CDHash=", "Identifier=", "Authority=")):
                      key, value = line.split("=", 1)
                      values.setdefault(key, []).append(value)
              require(values.get("CDHash") == [APP_CDHASH], "App CDHash is not the approved 0.13.4 build")
              require(values.get("Identifier") == ["jp.co.dbajapan.DBAVoice"], "App identifier mismatch")
              return values
          
          
          def validate_tar_headers(path, expected):
              """Inspect exactly the archive to extract, including normalized owners and safe paths."""
              seen = set()
              with tarfile.open(path, "r|xz") as archive:
                  for member in archive:
                      name = PurePosixPath(member.name)
                      require(not name.is_absolute() and ".." not in name.parts
                              and name.parts and name.parts[0] == APP_NAME, "Unsafe tar member path")
                      relative = name.relative_to(APP_NAME).as_posix()
                      require(relative not in seen and relative in expected, f"Unexpected/repeated tar entry: {relative}")
                      seen.add(relative)
                      require(member.uid == 0 and member.gid == 0 and member.uname == "root" and member.gname == "wheel",
                              f"Tar owner metadata was not normalized: {relative}")
                      require(member.isfile() or member.isdir() or member.issym(), f"Unsupported tar entry type: {relative}")
                      kind = "file" if member.isfile() else "directory" if member.isdir() else "symlink"
                      require(kind == expected[relative]["kind"], f"Tar entry type mismatch: {relative}")
                      if member.issym():
                          require(member.linkname == expected[relative]["target"], f"Tar link mismatch: {relative}")
                      require(not any("xattr" in key.lower() or "acl" in key.lower() for key in member.pax_headers),
                              f"Unrequested extended metadata in tar: {relative}")
              require(seen == set(expected), "Missing tar entries")
          
          
          def build(work):
              for command in ("python3", "curl", "ditto", "tar", "xz", "codesign", "gh"):
                  require(shutil.which(command) is not None, f"Required existing runner command is missing: {command}; no install attempted")
              work.mkdir(parents=True, exist_ok=False)
              # ZIP + extracted source + compressed output + verification extraction.
              # The uncompressed tar is streamed, never stored as another full copy.
              required_free_bytes = 8 * 1024**3
              free_bytes_at_start = shutil.disk_usage(work).free
              require(free_bytes_at_start >= required_free_bytes, "At least 8 GiB free disk is required; no cleanup or install attempted")
              release = public_release()
              validate_release(release)
              write_json(work / "release-before-build.json", release)
              source_zip = work / ZIP_NAME
              source_url = f"https://github.com/{REPO}/releases/download/{TAG}/{ZIP_NAME}"
              run("curl", "--fail", "--location", "--retry", "3", "--retry-delay", "5", "--connect-timeout", "30",
                  "--max-time", "1800", "--output", source_zip, source_url)
              require(source_zip.stat().st_size == ZIP_BYTES and sha256(source_zip) == ZIP_SHA256,
                      "Source ZIP size or SHA256 mismatch")
              with zipfile.ZipFile(source_zip) as archive:
                  for entry in archive.infolist():
                      name = PurePosixPath(entry.filename)
                      require(not name.is_absolute() and ".." not in name.parts, "Unsafe ZIP entry path")
                  require(archive.testzip() is None, "ZIP integrity failure")
          
              unpacked = work / "unpacked"
              unpacked.mkdir()
              run("ditto", "-x", "-k", source_zip, unpacked)
              app = unpacked / APP_NAME
              require(app.is_dir() and not app.is_symlink(), "Expected app missing")
              with (app / "Contents/Info.plist").open("rb") as stream:
                  info = plistlib.load(stream)
              require(info.get("CFBundleShortVersionString") == "0.13.4" and str(info.get("CFBundleVersion")) == "38",
                      "Unexpected app version/build")
              original = snapshot(app)
              require(len(original) == 127 and collections.Counter(item["kind"] for item in original.values())
                      == {"file": 65, "symlink": 5, "directory": 57}, "Approved app must have exactly 127 expected entries")
              model = original.get(MODEL_PATH, {})
              require(model.get("kind") == "file" and model.get("sha256") == MODEL_SHA256 and model.get("bytes") == MODEL_BYTES,
                      "Bundled model is not the approved original")
              original_signature = codesign_identity(app)
              write_json(work / "original-app-snapshot.json", original)
          
              txz = work / ASSET_NAMES[0]
              # Same standard bsdtar/xz pipeline as the isolated local compatibility test.
              # Inherit no caller-supplied tar/xz options; xattrs/ACL/flags are intentionally not archived.
              env = dict(os.environ)
              for key in ("TAR_OPTIONS", "XZ_OPT", "XZ_DEFAULTS"):
                  env.pop(key, None)
              env["COPYFILE_DISABLE"] = "1"
              with txz.open("xb") as output:
                  tar_process = subprocess.Popen(
                      ["/usr/bin/tar", *TAR_OPTIONS, "-cf", "-", "-C", str(unpacked), APP_NAME],
                      stdout=subprocess.PIPE, env=env,
                  )
                  try:
                      xz_process = subprocess.Popen(["xz", *XZ_OPTIONS], stdin=tar_process.stdout, stdout=output, env=env)
                  except BaseException:
                      tar_process.stdout.close()
                      tar_process.wait()
                      raise
                  tar_process.stdout.close()
                  xz_status = xz_process.wait()
                  tar_status = tar_process.wait()
              require(tar_status == 0 and xz_status == 0, f"Compression failed: tar={tar_status}, xz={xz_status}")
              validate_archive_size(txz.stat().st_size)
              run("xz", "--test", txz, env=env)
              validate_tar_headers(txz, original)
              restored = work / "restored"
              restored.mkdir()
              run("/usr/bin/tar", "-xpf", txz, "-C", restored, env=env)
              require(sorted(path.name for path in restored.iterdir()) == [APP_NAME], "Unexpected restored top-level entry")
              roundtrip = snapshot(restored / APP_NAME)
              require_same(original, roundtrip, "Source ZIP app versus restored tar.xz app")
              restored_signature = codesign_identity(restored / APP_NAME)
              require(original_signature == restored_signature, "Code signing identity changed")
              # Confirm the source wasn't modified by reading or packing.
              require_same(original, snapshot(app), "Source app before versus after packing")
          
              digest = sha256(txz)
              (work / ASSET_NAMES[1]).write_text(f"{digest}  {ASSET_NAMES[0]}\n", encoding="utf-8")
              report = {
                  "schema_version": 1,
                  "generated_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "repository": REPO, "release_tag": TAG,
                  "source_zip": {"name": ZIP_NAME, "sha256": ZIP_SHA256, "bytes": ZIP_BYTES},
                  "archive": {"name": txz.name, "sha256": digest, "bytes": txz.stat().st_size,
                              "format": "PAX tar inside XZ", "tar_options": TAR_OPTIONS, "xz_options": XZ_OPTIONS,
                              "size_gate": {"baseline_name": DMG_NAME, "baseline_bytes": DMG_BYTES,
                                            "maximum_bytes": MAXIMUM_ARCHIVE_BYTES,
                                            "minimum_reduction_percent": 1,
                                            "actual_reduction_percent": round((DMG_BYTES - txz.stat().st_size) / DMG_BYTES * 100, 6)},
                              "xz_version": run("xz", "--version", capture_output=True, text=True).stdout.splitlines()[0]},
                  "app": {"name": APP_NAME, "version": "0.13.4", "build": "38",
                          "model": {"path": MODEL_PATH, "sha256": MODEL_SHA256, "bytes": MODEL_BYTES},
                          "entry_count": len(original),
                          "entries_by_kind": dict(collections.Counter(item["kind"] for item in original.values())),
                          "snapshot_sha256": hashlib.sha256(canonical_bytes(original)).hexdigest(),
                          "signature": original_signature,
                          "entries": original},
                  "verified": {"source_zip_sha256": True, "source_zip_integrity": True, "xz_integrity": True,
                               "at_least_one_percent_smaller_than_existing_dmg": True,
                               "restored_entry_differences": 0, "source_entry_differences_after_packing": 0,
                               "entry_checks": ["path", "kind", "file_sha256", "file_bytes", "symlink_target", "full_mode", "mtime_ns"],
                               "normalized_tar_owner": "0:0 root:wheel", "extended_attributes_preserved": False,
                               "source_codesign_deep_strict": True, "restored_codesign_deep_strict": True,
                               "resigned": False, "app_executed_on_runner": False,
                               "archive_utility_gui_test_on_runner": False},
                  "runner_macos": run("sw_vers", "-productVersion", capture_output=True, text=True).stdout.strip(),
                  "runner_free_bytes_before_download": free_bytes_at_start,
                  "workflow_run": f"https://github.com/{REPO}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              }
              write_json(work / ASSET_NAMES[2], report)
              print(json.dumps({"archive": report["archive"], "entry_count": len(original), "verified": report["verified"]}, indent=2))
          
          
          def before_upload(work):
              release = json.loads(run("gh", "api", f"repos/{REPO}/releases/tags/{TAG}", capture_output=True, text=True).stdout)
              validate_release(release)
              require_unchanged_release(json.loads((work / "release-before-build.json").read_text()), release)
              report = json.loads((work / ASSET_NAMES[2]).read_text())
              require(report["verified"]["restored_entry_differences"] == 0
                      and report["verified"]["restored_codesign_deep_strict"] is True
                      and report["verified"]["resigned"] is False, "Missing verification gates")
              archive = work / ASSET_NAMES[0]
              validate_archive_size(archive.stat().st_size)
              digest = sha256(archive)
              require(digest == report["archive"]["sha256"] and archive.stat().st_size == report["archive"]["bytes"],
                      "Archive changed after verification")
              require((work / ASSET_NAMES[1]).read_text() == f"{digest}  {ASSET_NAMES[0]}\n", "Checksum file mismatch")
              write_json(work / "release-before-upload.json", release)
          
          
          def validate_added_assets(before, assets):
              """Permit only our three additions and the exact separate local recovery archive."""
              old_names = {asset["name"] for asset in before["assets"]}
              added = set(assets) - old_names
              require(set(ASSET_NAMES).issubset(added), "One or more compact assets were not newly added")
              extra = added - set(ASSET_NAMES)
              require(extra.issubset({CONCURRENT_ARCHIVE_NAME}), "Unexpected set of added assets")
              if extra:
                  concurrent = assets[CONCURRENT_ARCHIVE_NAME]
                  require(concurrent.get("size") == CONCURRENT_ARCHIVE_BYTES
                          and concurrent.get("digest") == "sha256:" + CONCURRENT_ARCHIVE_SHA256
                          and concurrent.get("state") == "uploaded"
                          and concurrent.get("browser_download_url") ==
                              f"https://github.com/{REPO}/releases/download/{TAG}/{CONCURRENT_ARCHIVE_NAME}",
                          "Concurrent recovery archive does not match the approved local file")
              return sorted(extra)
          
          
          def after_upload(work):
              after = json.loads(run("gh", "api", f"repos/{REPO}/releases/tags/{TAG}", capture_output=True, text=True).stdout)
              before = json.loads((work / "release-before-upload.json").read_text())
              assets = validate_release(after, require_absent=False)
              require_unchanged_release(before, after)
              concurrent_additions = validate_added_assets(before, assets)
              for name in ASSET_NAMES:
                  path = work / name
                  digest = sha256(path)
                  require(assets[name].get("size") == path.stat().st_size
                          and assets[name].get("digest") == "sha256:" + digest
                          and assets[name].get("state") == "uploaded", f"GitHub asset verification failed: {name}")
                  print(f"Verified new asset: {name}; bytes={path.stat().st_size}; SHA256={digest}")
              write_json(work / "release-after-upload.json", after)
              print("Existing release text and every pre-existing asset are unchanged.")
              if concurrent_additions:
                  print("Observed the approved separate local recovery archive; this workflow did not modify it.")
          
          
          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("phase", choices=("build", "before-upload", "after-upload"))
              args = parser.parse_args()
              work = Path(os.environ["REPACK_DIR"])
              {"build": build, "before-upload": before_upload, "after-upload": after_upload}[args.phase](work)
          
          
          if __name__ == "__main__":
              main()
          PY_REPACK
          python3 "$RUNNER_TEMP/dba-voice-fast-repack-mac-txz.py" build

      - name: Add only the three verified new assets
        env:
          REPACK_DIR: ${{ runner.temp }}/dba-voice-lossless-compact-txz
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/dba-voice-fast-repack-mac-txz.py" before-upload
          cd "$REPACK_DIR"
          # One main-file attempt only. Any failure stops this step before sidecars.
          # HTTP/2 opt-out applies only to this attempt; it is not a guarantee of recovery.
          # No --clobber or deletion. A name collision fails without replacement.
          GODEBUG=http2client=0 gh release upload mac-preview-0.13.4 DBA-Voice-Mac-compact.tar.xz \
            --repo munchtokyo/dba-voice-releases
          gh release upload mac-preview-0.13.4 \
            DBA-Voice-Mac-compact.tar.xz.sha256 DBA-Voice-Mac-compact.tar.xz.verification.json \
            --repo munchtokyo/dba-voice-releases
          python3 "$RUNNER_TEMP/dba-voice-fast-repack-mac-txz.py" after-upload
